<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Planificador Thiago & Valentina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: la semana se lee como la tabla del Doc. Una fila por dia, columnas Thiago | Valentina, y una franja menta con corazon para lo que hacen juntos. */
:root{
  --bg:#FAFAFC; --surface:#FFFFFF; --line:#E9EAF1; --line-strong:#D6D9E6; --today:#F3F5FF;
  --ink:#191B2A; --muted:#656982; --faint:#9A9DB0;
  --th:#4C57D6; --th-soft:#EEF0FF; --th-line:#D3D8FA; --th-ink:#2D35A6;
  --va:#A63FC6; --va-soft:#F9EEFC; --va-line:#EBCEF4; --va-ink:#7C2B97;
  --jn:#13895F; --jn-soft:#E6F7F0; --jn-line:#BDE8D6; --jn-ink:#0A6446;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--bg)}
body{
  margin:0;color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;
  padding-top:calc(20px + env(safe-area-inset-top,0px));
  padding-bottom:calc(64px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
h1,h2,h3,p,ul{margin:0;padding:0}
ul{list-style:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--th);outline-offset:2px;border-radius:8px}

.who-thiago{--c:var(--th);--c-soft:var(--th-soft);--c-line:var(--th-line);--c-ink:var(--th-ink)}
.who-valentina{--c:var(--va);--c-soft:var(--va-soft);--c-line:var(--va-line);--c-ink:var(--va-ink)}
.who-ambos{--c:var(--jn);--c-soft:var(--jn-soft);--c-line:var(--jn-line);--c-ink:var(--jn-ink)}

.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:20px;min-width:0}
.head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px 16px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.title{font-family:var(--display);font-weight:800;font-size:clamp(21px,3.6vw,30px);line-height:1.1;letter-spacing:-0.02em;text-wrap:balance}
.title .amp{color:var(--jn)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.sync{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.sync.online i{background:var(--jn)}
.sync.offline i{background:#C98A12}

.avatars{display:flex;align-items:center;flex:none}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px;color:#fff;background:var(--c);border:2px solid var(--bg)}
.heartdot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--jn-soft);color:var(--jn);border:2px solid var(--bg);margin-inline:-5px;z-index:1}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tab{display:flex;align-items:center;gap:10px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:9px 12px;transition:border-color .15s,background .15s;min-width:0}
.tab:hover{border-color:var(--line-strong)}
.tab .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--c-soft);color:var(--c);flex:none}
.tab .t1{display:block;font-weight:700;font-size:15px;line-height:1.2}
.tab .t2{display:block;font-size:13px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--c-soft);border-color:var(--c)}
.tab[aria-selected="true"] .ico{background:var(--c);color:#fff}
.tab[aria-selected="true"] .t2{color:var(--c-ink)}
@media(max-width:620px){.tab .ico{display:none}.tab{padding:8px 10px}.tab .t1{font-size:13px}.tab .t2{font-size:12px}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:clamp(18px,3vw,28px)}
.h2{font-family:var(--display);font-weight:700;font-size:clamp(21px,3.2vw,26px);letter-spacing:-0.01em;line-height:1.15}
.hint{color:var(--muted);font-size:15px}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lbl{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.input{width:100%;font-size:18px;padding:13px 16px;background:var(--surface);border:1.5px solid var(--line-strong);border-radius:14px;min-width:0}
.input::placeholder{color:var(--faint)}
.input:focus{outline:none;border-color:var(--c,var(--th));box-shadow:0 0 0 4px var(--c-soft,var(--th-soft))}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:560px){.seg{grid-template-columns:1fr}}
.seg button{padding:12px 14px;border-radius:14px;border:1.5px solid var(--line-strong);font-weight:600;font-size:16px;background:var(--surface);display:flex;align-items:center;justify-content:center;gap:8px}
.seg button[aria-checked="true"]{background:var(--c-soft);border-color:var(--c);color:var(--c-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:17px;padding:13px 22px;border-radius:14px;background:var(--c,var(--ink));color:#fff;transition:filter .15s}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line-strong)}
.btn.ghost:hover{filter:none;border-color:var(--ink)}
.btn.ghost[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.sm{padding:9px 14px;font-size:15px;border-radius:12px}
.icon-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--faint);flex:none}
.icon-btn:hover{background:var(--line);color:var(--ink)}

.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.range{font-family:var(--display);font-weight:700;font-size:clamp(19px,2.8vw,24px);letter-spacing:-0.01em}
.navgrp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.modeseg{display:inline-flex;background:var(--line);border-radius:12px;padding:3px}
.modeseg button{padding:7px 14px;border-radius:10px;font-weight:600;font-size:15px;color:var(--muted)}
.modeseg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(25,27,42,.1)}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.strip button{display:flex;flex-direction:column;align-items:center;padding:7px 0;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:13px;color:var(--muted);min-width:0}
.strip button b{font-family:var(--display);font-size:19px;color:var(--ink);line-height:1.2}
.strip button[aria-pressed="true"]{border-color:var(--ink)}
.strip button.hasEv::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--jn);margin-top:2px}

/* ---- Tabla de la semana ---- */
.week{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:clip}
.wk-head{display:none}
.wk-row{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.wk-row:first-of-type{border-top:0}
.wk-row.today{background:var(--today)}
.wk-row.past .lines,.wk-row.past .wk-j{opacity:.55}
.wk-day{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:14px 16px 4px}
.dname{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-0.01em;line-height:1.15}
.ddate{color:var(--muted);font-size:14px}
.today-pill{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--ink);color:#fff;border-radius:999px;padding:2px 9px}
.addday{margin-left:auto;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line-strong);display:grid;place-items:center;color:var(--muted);background:var(--surface);flex:none}
.addday:hover{border-color:var(--ink);color:var(--ink)}
.wk-j{grid-column:1/-1;margin:6px 12px 0;background:var(--jn-soft);border:1.5px solid var(--jn-line);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;color:var(--jn)}
.wk-j .lines{flex:1;min-width:0}
.wk-j .ln-text{font-family:var(--display);font-weight:700;font-size:19px;color:var(--ink)}
.wk-j .ln-time{color:var(--jn-ink)}
.wk-cell{padding:8px 16px 14px;min-width:0}
.cell-label{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--c);margin-bottom:6px}
.none{color:var(--faint)}
.lines{display:flex;flex-direction:column;gap:7px}
.ln{display:flex;align-items:flex-start;gap:9px;min-width:0}
.ck{width:20px;height:20px;border-radius:50%;border:2px solid var(--c);display:grid;place-items:center;color:#fff;flex:none;margin-top:2px;background:#fff}
.ck[aria-pressed="true"]{background:var(--c)}
.ln-body{flex:1;min-width:0;font-size:17px;line-height:1.35;overflow-wrap:anywhere}
.ln-time{font-weight:700;color:var(--c-ink);font-variant-numeric:tabular-nums;margin-right:6px;font-size:15px}
.ln.done .ln-body{text-decoration:line-through;color:var(--faint)}
.ln.done .ln-time{color:var(--faint)}
.ln .x{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--faint);flex:none;margin:-2px -4px 0 0}
.ln .x:hover{background:var(--line);color:var(--ink)}
.week.big .ln-body{font-size:19px}

@media(min-width:701px){
  .wk-head{display:grid;grid-template-columns:132px 1fr 1fr;position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:var(--surface);border-bottom:1px solid var(--line)}
  .wk-head>div{padding:11px 16px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
  .wk-head .th{background:var(--th-soft);color:var(--th-ink)}
  .wk-head .va{background:var(--va-soft);color:var(--va-ink)}
  .wk-head .dc{color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-size:12px}
  .wk-head .dot{width:9px;height:9px;border-radius:50%;background:currentColor}
  .wk-row{grid-template-columns:132px 1fr 1fr}
  .wk-day{grid-column:auto;display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:16px;border-right:1px solid var(--line)}
  .wk-row.has-j .wk-day{grid-row:1 / span 2}
  .addday{margin-left:0;margin-top:8px}
  .wk-j{grid-column:2 / 4;margin:12px 14px 0}
  .wk-cell{padding:14px 16px}
  .wk-cell.v{border-left:1px solid var(--line)}
  .cell-label{display:none}
}

.two{display:grid;grid-template-columns:1fr;gap:22px}
@media(min-width:820px){.two{grid-template-columns:1fr 1fr}}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--c);display:grid;place-items:center;color:#fff;flex:none;margin-top:1px;background:#fff}
.check[aria-pressed="true"]{background:var(--c)}
.time{display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:700;color:var(--c-ink);background:var(--c-soft);border-radius:999px;padding:2px 10px;font-variant-numeric:tabular-nums}
.listline{display:flex;align-items:flex-start;gap:12px;padding:12px 6px 12px 0;border-bottom:1px solid var(--line)}
.listline:last-child{border-bottom:0}
.listline .txt{flex:1;min-width:0;font-size:18px;overflow-wrap:anywhere}
.listline.done .txt{text-decoration:line-through;color:var(--faint)}
.addrow{display:flex;gap:10px}
.addrow .btn{flex:none}
.empty{color:var(--faint);font-size:16px;padding:6px 0}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.bar>div{height:100%;background:var(--jn);border-radius:999px;transition:width .25s}

.banner{display:flex;align-items:center;gap:16px;background:var(--c-soft);border:1.5px solid var(--c-line);border-radius:24px;padding:clamp(16px,3vw,24px)}
.banner .ico{width:52px;height:52px;border-radius:16px;background:var(--c);color:#fff;display:grid;place-items:center;flex:none}
.banner h2{color:var(--c-ink)}
.dayrow{display:grid;grid-template-columns:104px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.dayrow:last-child{border-bottom:0}
.dayrow .dn{font-weight:700;font-size:16px;padding-top:4px}
@media(max-width:480px){.dayrow{grid-template-columns:1fr;gap:6px}}
.slot{display:flex;align-items:center;gap:8px;padding:4px 0}
.slot .txt{flex:1;min-width:0;font-size:18px;overflow-wrap:anywhere}
.formrow{display:grid;gap:14px;grid-template-columns:1fr}

.overlay{position:fixed;inset:0;z-index:50;background:rgba(25,27,42,.42);display:flex;align-items:flex-start;justify-content:center;overflow:auto;
  padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal{background:var(--surface);border-radius:24px;width:100%;max-width:560px;margin:auto;padding:clamp(18px,4vw,28px);display:flex;flex-direction:column;gap:18px;box-shadow:0 20px 60px rgba(25,27,42,.25)}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function normalize(d){
  const b=d&&typeof d==='object'?d:{};
  const pv=b.priv||{};
  const sp=k=>({fixed:(pv[k]&&pv[k].fixed)||[],notes:(pv[k]&&pv[k].notes)||[]});
  return {tasks:b.tasks||[],goals:b.goals||[],reminders:b.reminders||[],priv:{thiago:sp('thiago'),valentina:sp('valentina')}};
}

/* ---------- Estado <-> filas de la tabla "items" ---------- */
function eq(a,b){
  if(a===b)return true;
  if(!a||!b||typeof a!=='object'||typeof b!=='object')return false;
  const ka=Object.keys(a),kb=Object.keys(b);
  if(ka.length!==kb.length)return false;
  return ka.every(k=>eq(a[k],b[k]));
}
function ensurePos(s,start){
  let n=start;
  const fix=a=>a.map(x=>x.pos==null?{...x,pos:n++}:x);
  return {
    tasks:fix(s.tasks),goals:fix(s.goals),reminders:fix(s.reminders),
    priv:{
      thiago:{fixed:fix(s.priv.thiago.fixed),notes:fix(s.priv.thiago.notes)},
      valentina:{fixed:fix(s.priv.valentina.fixed),notes:fix(s.priv.valentina.notes)},
    },
  };
}
function flatten(s){
  const m=new Map();
  const put=(item,kind,owner)=>{const {id,...data}=item;m.set(id,{kind,owner:owner||null,data});};
  s.tasks.forEach(t=>put(t,'task'));
  s.goals.forEach(g=>put(g,'goal'));
  s.reminders.forEach(r=>put(r,'reminder'));
  ['thiago','valentina'].forEach(w=>{
    s.priv[w].fixed.forEach(f=>put(f,'fixed',w));
    s.priv[w].notes.forEach(n=>put(n,'note',w));
  });
  return m;
}
function build(map){
  const s={tasks:[],goals:[],reminders:[],priv:{thiago:{fixed:[],notes:[]},valentina:{fixed:[],notes:[]}}};
  const rows=[...map.entries()].sort((a,b)=>(a[1].data.pos||0)-(b[1].data.pos||0));
  rows.forEach(([id,r])=>{
    const item={...r.data,id};
    if(r.kind==='task')s.tasks.push(item);
    else if(r.kind==='goal')s.goals.push(item);
    else if(r.kind==='reminder')s.reminders.push(item);
    else if(r.kind==='fixed'&&s.priv[r.owner])s.priv[r.owner].fixed.push(item);
    else if(r.kind==='note'&&s.priv[r.owner])s.priv[r.owner].notes.push(item);
  });
  return s;
}

/* ---------- Guardado en la nube con tiempo real ---------- */
const CACHE_KEY='planner-thiago-valentina-cache-v1';
function loadCache(){
  try{const raw=localStorage.getItem(CACHE_KEY);return raw?normalize(JSON.parse(raw)):null;}catch(e){return null;}
}
function saveCache(d){
  try{localStorage.setItem(CACHE_KEY,JSON.stringify(d));}catch(e){}
}
const rowOf=r=>({kind:r.kind,owner:r.owner,data:r.data});

function usePlannerStore(){
  const [data,setData]=useState(()=>loadCache()||ensurePos(normalize(SEED),1));
  const [sync,setSync]=useState('connecting');
  const [ready,setReady]=useState(false);
  const latest=useRef(data);
  const remote=useRef(new Map());   // lo que sabemos que hay en la nube
  const loaded=useRef(false);
  const sbRef=useRef(null);
  const timer=useRef(null);
  const retry=useRef(null);
  const busy=useRef(false);

  const setState=useCallback(n=>{latest.current=n;setData(n);saveCache(n);},[]);

  // Manda a la nube solo lo que cambio (altas, tachados, bajas)
  const flush=useCallback(async()=>{
    if(!loaded.current||!sbRef.current)return;
    if(busy.current){clearTimeout(timer.current);timer.current=setTimeout(flush,300);return;}
    busy.current=true;
    try{
      const local=flatten(latest.current);
      const up=[],del=[];
      local.forEach((row,id)=>{if(!eq(row,remote.current.get(id)))up.push({id,...row,updated_at:new Date().toISOString()});});
      remote.current.forEach((_,id)=>{if(!local.has(id))del.push(id);});
      if(up.length){
        const {error}=await sbRef.current.from('items').upsert(up);
        if(error)throw error;
        up.forEach(r=>remote.current.set(r.id,rowOf(r)));
      }
      if(del.length){
        const {error}=await sbRef.current.from('items').delete().in('id',del);
        if(error)throw error;
        del.forEach(id=>remote.current.delete(id));
      }
      setSync('online');
    }catch(e){
      setSync('offline');
      clearTimeout(timer.current);
      timer.current=setTimeout(flush,4000);
    }finally{busy.current=false;}
  },[]);

  const update=useCallback(fn=>{
    if(!loaded.current)return;
    const next=ensurePos(fn(latest.current),Date.now());
    setState(next);
    clearTimeout(timer.current);
    timer.current=setTimeout(flush,250);
  },[flush,setState]);

  // Aplica cambios que llegan de la nube sin pisar lo que esta pendiente de enviar
  const applyRows=useCallback(changes=>{
    const localMap=flatten(latest.current);
    let changed=false;
    changes.forEach(([id,row])=>{
      const prev=remote.current.get(id);
      const localUnchanged=eq(localMap.get(id),prev);
      if(row)remote.current.set(id,row);else remote.current.delete(id);
      if(localUnchanged){
        const cur=localMap.get(id);
        if(row){if(!eq(cur,row)){localMap.set(id,row);changed=true;}}
        else if(cur){localMap.delete(id);changed=true;}
      }
    });
    if(changed)setState(build(localMap));
  },[setState]);

  const fetchAll=useCallback(async()=>{
    const sb=sbRef.current;
    if(!sb)return false;
    try{
      const {data:rows,error}=await sb.from('items').select('*');
      if(error)throw error;
      if(!rows.some(r=>r.kind==='meta')){
        // Primera vez: se cargan los ejemplos una sola vez
        const seed=ensurePos(normalize(SEED),1);
        const flat=flatten(seed);
        const up=[];
        flat.forEach((row,id)=>up.push({id,...row}));
        up.push({id:'meta-seeded',kind:'meta',owner:null,data:{}});
        const {error:e2}=await sb.from('items').upsert(up);
        if(e2)throw e2;
        remote.current=new Map(flat);
        loaded.current=true;setReady(true);
        setState(seed);
      }else{
        const m=new Map();
        rows.forEach(r=>{if(r.kind!=='meta')m.set(r.id,rowOf(r));});
        if(!loaded.current){
          remote.current=m;
          loaded.current=true;setReady(true);
          setState(build(m));
        }else{
          const ids=new Set([...m.keys(),...remote.current.keys()]);
          applyRows([...ids].map(id=>[id,m.get(id)||null]));
        }
      }
      setSync('online');
      return true;
    }catch(e){
      setSync('offline');
      return false;
    }
  },[applyRows,setState]);

  useEffect(()=>{
    let dead=false;
    let channel=null;
    let sb=null;
    try{
      sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
    }catch(e){setSync('offline');return;}
    sbRef.current=sb;

    const connect=async()=>{
      const ok=await fetchAll();
      if(dead)return;
      if(!ok&&!loaded.current)retry.current=setTimeout(connect,5000);
    };
    connect();

    channel=sb.channel('agenda-items')
      .on('postgres_changes',{event:'*',schema:'public',table:'items'},p=>{
        if(!loaded.current)return;
        if(p.eventType==='DELETE'){applyRows([[p.old.id,null]]);}
        else if(p.new&&p.new.kind!=='meta'){applyRows([[p.new.id,rowOf(p.new)]]);}
      })
      .subscribe(status=>{
        if(status==='SUBSCRIBED'){if(loaded.current)fetchAll();}
        else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED'){setSync('offline');}
      });

    const refresh=()=>{if(document.visibilityState==='visible'&&loaded.current)fetchAll();};
    document.addEventListener('visibilitychange',refresh);
    window.addEventListener('online',refresh);
    return()=>{
      dead=true;
      clearTimeout(timer.current);clearTimeout(retry.current);
      document.removeEventListener('visibilitychange',refresh);
      window.removeEventListener('online',refresh);
      try{sb.removeChannel(channel);}catch(e){}
    };
  },[]);

  return {data,update,sync,ready};
}

        <div>
          <h2 className="h2">{isT?'Espacio Privado / Gym':'Espacio Privado'} · {name}</h2>
          <p className="hint" style={{color:'var(--c-ink)',opacity:.8}}>Lo que anotes acá no aparece en Nuestra Semana, así la vista de a dos queda liviana.</p>
        </div>
      </div>

      <div className="two">
        <section className="card stack" aria-labelledby={`h-fixed-${who}`}>
          <div style={{display:'flex',alignItems:'center',gap:12}}>
            <span style={{color:'var(--c)'}}><FixedIcon size={26}/></span>
            <h2 className="h2" id={`h-fixed-${who}`}>{fixedTitle}</h2>
          </div>
          <form onSubmit={addFixed} className="stack">
            <div className="formrow" style={{gridTemplateColumns:'1fr 1fr'}}>
              <div className="field">
                <label htmlFor={`pf-day-${who}`}>Día</label>
                <select id={`pf-day-${who}`} className="input" value={day} onChange={e=>setDay(e.target.value)}>
                  {DAYS.map((d,i)=><option key={d} value={i}>{d}</option>)}
                </select>
              </div>
              <div className="field">
                <label htmlFor={`pf-time-${who}`}>Hora</label>
                <input id={`pf-time-${who}`} type="time" className="input" value={time} onChange={e=>setTime(e.target.value)}/>
              </div>
            </div>
            <div className="addrow">
              <input id={`pf-what-${who}`} aria-label="Actividad" className="input" value={what} onChange={e=>setWhat(e.target.value)} placeholder={isT?'Ej. Pecho y espalda':'Ej. Clase de yoga'} autoComplete="off"/>
              <button className="btn" type="submit" aria-label="Agregar horario fijo"><I.Plus size={20} strokeWidth={2.5}/></button>
            </div>
          </form>
          <div>
            {DAYS.map((dn,i)=>{
              const items=space.fixed.filter(f=>f.day===i).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));
              return (
                <div className="dayrow" key={dn}>
                  <span className="dn">{dn}</span>
                  <div>
                    {items.length===0&&<span className="empty">Libre</span>}
                    {items.map(f=>(
                      <div className="slot" key={f.id}>
                        {f.time&&<span className="time"><I.Clock size={13}/>{f.time}</span>}
                        <span className="txt">{f.text}</span>
                        <button className="icon-btn" aria-label={`Eliminar: ${f.text}`} onClick={()=>patch(s=>({...s,fixed:s.fixed.filter(x=>x.id!==f.id)}))}><I.Trash size={17}/></button>
                      </div>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>
        </section>

        <section className="card stack" aria-labelledby={`h-notes-${who}`}>
          <div style={{display:'flex',alignItems:'center',gap:12}}>
            <span style={{color:'var(--c)'}}><I.Note size={26}/></span>
            <h2 className="h2" id={`h-notes-${who}`}>{isT?'Notas, rutinas y compromisos':'Notas y compromisos'}</h2>
          </div>
          <AddLine id={`pn-${who}`} label="Nueva nota" placeholder={isT?'Ej. Pedir turno para el médico':'Ej. Comprar apuntes'} onAdd={t=>patch(s=>({...s,notes:[...s.notes,{id:uid(),text:t,done:false}]}))}/>
          {space.notes.length===0&&<p className="empty">Todavía no hay notas. Escribí la primera arriba.</p>}
          <ul>
            {space.notes.map(n=>(
              <li key={n.id} className={`listline ${n.done?'done':''}`}>
                <button className="check" aria-pressed={n.done} aria-label={`Marcar nota: ${n.text}`}
                  onClick={()=>patch(s=>({...s,notes:s.notes.map(x=>x.id===n.id?{...x,done:!x.done}:x)}))}>
                  {n.done&&<I.Check size={15} strokeWidth={3}/>}
                </button>
                <span className="txt">{n.text}</span>
                <button className="icon-btn" aria-label={`Eliminar nota: ${n.text}`} onClick={()=>patch(s=>({...s,notes:s.notes.filter(x=>x.id!==n.id)}))}><I.Trash size={17}/></button>
              </li>
            ))}
          </ul>
        </section>
      </div>
    </div>
  );
}

function App(){
  const {data,update,sync,ready}=usePlannerStore();
  const [tab,setTab]=useState('shared');
  const tabs=[
    {k:'shared',cls:'who-ambos',t1:'Vista Compartida',t2:'Nuestra Semana',ico:<I.Users size={20}/>},
    {k:'thiago',cls:'who-thiago',t1:'Espacio Privado / Gym',t2:'Thiago',ico:<I.Dumbbell size={20}/>},
    {k:'valentina',cls:'who-valentina',t1:'Espacio Privado',t2:'Valentina',ico:<I.Lock size={20}/>},
  ];
  let syncText='Conectando…';
  if(!ready&&sync==='offline')syncText='Sin conexión: solo lectura, reintentando';
  else if(ready&&sync==='online')syncText='Sincronizado en tiempo real';
  else if(ready&&sync==='offline')syncText='Sin conexión: se guarda al volver';
  return (
    <div className="wrap" style={{gap:18}}>
      <header className="head">
        <div className="brand">
          <div className="avatars" aria-hidden="true">
            <span className="avatar who-thiago">T</span>
            <span className="heartdot"><I.Heart size={13}/></span>
            <span className="avatar who-valentina">V</span>
          </div>
          <h1 className="title">Planificador Semanal <span className="amp">-</span> Thiago &amp; Valentina</h1>
        </div>
        <span className={`sync ${sync}`} role="status"><i/>{syncText}</span>
      </header>

      <nav className="tabs" role="tablist" aria-label="Vistas del planificador">
        {tabs.map(t=>(
          <button key={t.k} role="tab" aria-selected={tab===t.k} className={`tab ${t.cls}`} onClick={()=>setTab(t.k)}>
            <span className="ico">{t.ico}</span>
            <span><span className="t1">{t.t1}</span><span className="t2">{t.t2}</span></span>
          </button>
        ))}
      </nav>

      {tab==='shared'&&<SharedView data={data} update={update}/>}
      {tab==='thiago'&&<PrivateSpace who="thiago" data={data} update={update}/>}
      {tab==='valentina'&&<PrivateSpace who="valentina" data={data} update={update}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
